<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Test</title>
  <style>
    .menu-toggle {
      display: block;
      background: red;
      border: 2px solid blue;
      padding: 10px;
      cursor: pointer;
    }
    .menu-toggle span {
      display: block;
      width: 25px;
      height: 3px;
      background: black;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <button class="menu-toggle" aria-label="Toggle menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
  
  <nav class="main-nav">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>
  
  <script src="js/main.js"></script>
  <script>
    console.log('Menu toggle element:', document.querySelector('.menu-toggle'));
    console.log('Main nav element:', document.querySelector('.main-nav'));
    
    const btn = document.querySelector('.menu-toggle');
    if (btn) {
      btn.addEventListener('click', function() {
        console.log('Menu button clicked!');
        alert('Menu button works!');
      });
    }
  </script>
</body>
</html>
